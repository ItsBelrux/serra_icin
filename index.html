<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#ffe1ec">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌺</text></svg>">
<title>Serra için bir yolculuk 🌷</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,700;1,9..144,500&family=Caveat:wght@500;700&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --sky-a:#fff3ee; --sky-b:#ffe1ec; --sky-c:#ffd9ea; --sky-d:#fff0d9;
    --rose:#d63566; --rose-deep:#b02551; --rose-soft:#ff8fab;
    --sun:#ffb648; --sun-deep:#e08a1e;
    --plum:#5c2a3d; --plum-soft:#8a5064;
    --sage:#5f9468; --sage-light:#9fcf9f;
    --sky-blue:#8fc7e8;
    --lav:#b79ce0;
    --paper:#fffaf5;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;}
  body{
    font-family:'Quicksand',sans-serif;
    color:var(--plum);
    background:linear-gradient(160deg,var(--sky-a),var(--sky-b) 40%,var(--sky-c) 75%,var(--sky-d));
    background-size:300% 300%;
    animation:skyshift 18s ease infinite;
    min-height:100vh;
    overflow-x:hidden;
    position:relative;
  }
  @keyframes skyshift{0%{background-position:0% 0%;}50%{background-position:100% 60%;}100%{background-position:0% 0%;}}

  .sun{
    position:fixed; top:-40px; right:-30px; width:180px; height:180px; border-radius:50%;
    background:radial-gradient(circle at 35% 35%, #fff3d6, var(--sun) 60%, var(--sun-deep) 100%);
    box-shadow:0 0 70px 20px rgba(255,182,72,0.35);
    z-index:0; opacity:0.85;
    animation:pulse 6s ease-in-out infinite;
  }
  @keyframes pulse{0%,100%{transform:scale(1);}50%{transform:scale(1.05);}}

  .sparkle{
    position:fixed; width:5px; height:5px; border-radius:50%;
    background:#fff; box-shadow:0 0 8px 2px rgba(255,230,190,0.8);
    z-index:0; opacity:0;
    animation:twinkle 3.6s ease-in-out infinite;
  }
  @keyframes twinkle{ 0%,100%{opacity:0; transform:scale(0.6);} 50%{opacity:0.85; transform:scale(1.3);} }

  .bee{
    position:fixed; z-index:5; font-size:20px; top:20%;
    animation: beefly 13s ease-in-out infinite;
    pointer-events:none;
  }
  @keyframes beefly{
    0%{ left:-5%; top:22%; transform:rotate(0deg); }
    25%{ left:30%; top:12%; transform:rotate(10deg);}
    50%{ left:60%; top:28%; transform:rotate(-8deg);}
    75%{ left:85%; top:15%; transform:rotate(6deg);}
    100%{ left:105%; top:22%; transform:rotate(0deg);}
  }
  .butterfly{
    position:fixed; z-index:5; font-size:22px; top:60%;
    animation: flutter 16s ease-in-out infinite;
    pointer-events:none;
  }
  @keyframes flutter{
    0%{ left:105%; top:65%; transform:rotate(0deg) scale(1);}
    30%{ left:65%; top:45%; transform:rotate(-10deg) scale(1.1);}
    55%{ left:40%; top:70%; transform:rotate(8deg) scale(0.95);}
    80%{ left:10%; top:50%; transform:rotate(-6deg) scale(1.05);}
    100%{ left:-10%; top:55%; transform:rotate(0deg) scale(1);}
  }

  .garden-bed{
    position:fixed; bottom:0; left:0; width:100%; height:100px;
    z-index:4; pointer-events:none;
  }
  .petal-unfurl{
    animation: petalPop 0.55s cubic-bezier(.34,1.56,.64,1) both;
  }
  @keyframes petalPop{ from{ transform:scale(0); } to{ transform:scale(1); } }
  @keyframes gentleSway{ 0%,100%{ transform:rotate(-2.5deg); } 50%{ transform:rotate(2.5deg); } }

  .garden-bed svg{ width:100%; height:100%; overflow:visible; }
  .ground{
    position:fixed; bottom:0; left:0; width:100%; height:34px;
    background:linear-gradient(180deg, rgba(140,110,80,0) 0%, rgba(150,115,80,0.28) 100%);
    z-index:3; pointer-events:none;
  }

  .stage{
    position:relative; z-index:10;
    min-height:100vh; display:flex; align-items:center; justify-content:center;
    padding:90px 20px 130px;
  }
  .step{
    display:none;
    width:100%; max-width:460px;
  }
  .step.active{ display:block; animation:riseIn 0.6s cubic-bezier(.2,.8,.2,1) forwards; }
  @keyframes riseIn{ from{opacity:0; transform:translateY(18px);} to{opacity:1; transform:translateY(0);} }

  .card{
    background:var(--paper);
    border-radius:6px 6px 36px 6px;
    padding:44px 34px;
    box-shadow:0 1px 1px rgba(92,42,61,0.05), 0 22px 50px -18px rgba(92,42,61,0.4);
    text-align:center;
    position:relative;
  }

  .kicker{
    font-family:'Caveat',cursive; font-size:1.4rem; color:var(--plum-soft); margin-bottom:4px;
  }
  h1{
    font-family:'Fraunces',serif; font-weight:700; font-size:1.85rem; line-height:1.2;
    color:var(--rose); margin-bottom:14px;
  }
  h2{
    font-family:'Fraunces',serif; font-weight:600; font-style:italic; font-size:1.55rem;
    color:var(--rose); margin-bottom:18px; line-height:1.3;
  }
  p.lede{
    font-size:1.02rem; line-height:1.6; color:var(--plum-soft); margin-bottom:26px;
  }

  .choice-grid{
    display:grid; grid-template-columns:1fr 1fr; gap:12px;
  }
  .choice{
    background:#fff; border:1.5px solid #f3d9e2; border-radius:16px;
    padding:16px 10px; font-family:'Quicksand'; font-weight:600; font-size:0.92rem;
    color:var(--plum); cursor:pointer; transition:all 0.18s ease;
  }
  .choice:hover{ border-color:var(--rose-soft); background:#fff5f8; transform:translateY(-2px); }
  .choice:active{ transform:scale(0.97); }

  .primary-btn{
    background:var(--rose); color:#fff; font-weight:700; font-size:1.05rem;
    padding:16px 36px; border:none; border-radius:30px; cursor:pointer;
    box-shadow:0 10px 24px -6px rgba(214,53,102,0.55);
    transition:transform 0.18s ease, box-shadow 0.18s ease;
  }
  .primary-btn:hover{ transform:translateY(-2px) scale(1.03); }
  .primary-btn:active{ transform:scale(0.97); }

  .bouquet-hero{ width:190px; height:200px; margin:0 auto 8px; overflow:visible; }

  .actions{
    position:relative; display:flex; gap:16px; justify-content:center; align-items:center;
    min-height:56px; flex-wrap:wrap; margin-top:6px;
  }
  #no{
    background:transparent; color:var(--plum-soft); padding:15px 26px;
    border:1.5px solid #e8c3cf; border-radius:30px; font-weight:600; cursor:pointer;
    transition: transform 0.25s ease, opacity 0.25s ease, border-color 0.25s ease, left 0.22s ease, top 0.22s ease;
  }
  #no:hover{ border-color:#e0b0c0; }

  .aftermath{ display:none; margin-top:20px; }
  .aftermath.show{ display:block; animation:riseIn 0.7s ease forwards; }
  .aftermath .big{
    font-family:'Fraunces',serif; font-style:italic; font-size:1.5rem; color:var(--rose); margin-bottom:6px;
  }
  .aftermath .small{ color:var(--plum-soft); font-size:0.95rem; }

  .date-stamp{ margin-top:22px; font-family:'Caveat',cursive; font-size:1.15rem; color:#c9a6b3; }

  .petal-fall{ position:fixed; top:-5%; z-index:6; pointer-events:none; animation:fall linear forwards; }
  @keyframes fall{ 0%{transform:translateY(0) rotate(0deg); opacity:0.95;} 100%{transform:translateY(112vh) rotate(420deg); opacity:0.1;} }

  .balloon{
    position:fixed; bottom:-60px; z-index:6; pointer-events:none;
    animation: floatUp linear forwards;
  }
  @keyframes floatUp{
    0%{ transform:translateY(0) translateX(0); opacity:1; }
    100%{ transform:translateY(-120vh) translateX(var(--drift,20px)); opacity:0; }
  }

  @media (max-width:380px){
    h1{font-size:1.55rem;} .bouquet-hero{width:155px;height:165px;}
    .choice{font-size:0.85rem; padding:14px 8px;}
  }
  @media (prefers-reduced-motion: reduce){
    *{animation-duration:0.01ms !important; animation-iteration-count:1 !important;}
  }
</style>
</head>
<body>

<div class="sun"></div>
<div class="sparkle" style="top:12%; left:18%; animation-delay:0s;"></div>
<div class="sparkle" style="top:22%; left:78%; animation-delay:0.7s;"></div>
<div class="sparkle" style="top:34%; left:8%; animation-delay:1.4s;"></div>
<div class="sparkle" style="top:9%; left:55%; animation-delay:2.1s;"></div>
<div class="sparkle" style="top:29%; left:42%; animation-delay:0.4s;"></div>
<div class="bee">🐝</div>
<div class="butterfly">🦋</div>

<div class="ground"></div>
<div class="garden-bed"><svg id="gardenSvg" viewBox="0 0 400 100" preserveAspectRatio="xMidYMax meet"></svg></div>

<div class="stage">

  <section class="step active" data-step="0">
    <div class="card">
      <div class="kicker">Serra'ya</div>
      <h1>bir şey yaptım, bak</h1>
      <p class="lede">kod yazmayı biliyorum ama güzel laf etmeyi pek beceremiyorum, o yüzden bunu denedim. aç bakalım</p>
      <button class="primary-btn" onclick="goTo(1)">aç 🌷</button>
    </div>
  </section>

  <section class="step" data-step="1">
    <div class="card">
      <svg class="bouquet-hero" id="bouquetHero" viewBox="0 0 200 210"></svg>
      <h1>Serra</h1>
      <p class="lede">baya ugrastim bu siteyle, umarım beğenmişsindir cano.
      sorum basit:<br><br>sevgilim olur musun?</p>

      <div class="actions" id="finalButtons">
        <button class="primary-btn" onclick="sayYes()">evet, olurum 💌</button>
        <button id="no" onclick="noClick()">hayır</button>
      </div>

      <div class="aftermath" id="aftermath">
        <div class="big">seni seviyorum canım :)</div>
        <div class="small">resmi olarak benimsin artik :D</div>
      </div>

      <div class="date-stamp">05.09.2026.5:30</div>
    </div>
  </section>

</div>

<script>
const NS = "http://www.w3.org/2000/svg";

let gradCounter = 0;
function ensureDefs(svgRoot){
  let defs = svgRoot.querySelector('defs');
  if(!defs){ defs = document.createElementNS(NS,'defs'); svgRoot.insertBefore(defs, svgRoot.firstChild); }
  return defs;
}
function addPetalGradient(svgRoot, baseColor, tipColor){
  const defs = ensureDefs(svgRoot);
  const id = 'petalGrad'+(gradCounter++);
  const grad = document.createElementNS(NS,'linearGradient');
  grad.setAttribute('id', id);
  grad.setAttribute('x1','0'); grad.setAttribute('y1','1');
  grad.setAttribute('x2','0'); grad.setAttribute('y2','0');
  const s1 = document.createElementNS(NS,'stop'); s1.setAttribute('offset','0%'); s1.setAttribute('stop-color', baseColor);
  const s2 = document.createElementNS(NS,'stop'); s2.setAttribute('offset','100%'); s2.setAttribute('stop-color', tipColor);
  grad.appendChild(s1); grad.appendChild(s2);
  defs.appendChild(grad);
  return 'url(#'+id+')';
}
function petalPath(len, wid){
  return `M0,0 C-${wid},-${len*0.42} -${wid*0.55},-${len} 0,-${len} C${wid*0.55},-${len} ${wid},-${len*0.42} 0,0 Z`;
}
function poppyPetalPath(len, wid){
  return `M0,0 C-${wid*1.15},-${len*0.22} -${wid*1.05},-${len*0.9} 0,-${len} C${wid*1.05},-${len*0.9} ${wid*1.15},-${len*0.22} 0,0 Z`;
}
function radialCenter(svgRoot, r, colorCenter, colorEdge){
  const defs = ensureDefs(svgRoot);
  const id = 'centerGrad'+(gradCounter++);
  const grad = document.createElementNS(NS,'radialGradient');
  grad.setAttribute('id', id);
  grad.setAttribute('cx','35%'); grad.setAttribute('cy','32%'); grad.setAttribute('r','68%');
  const s1 = document.createElementNS(NS,'stop'); s1.setAttribute('offset','0%'); s1.setAttribute('stop-color', colorCenter);
  const s2 = document.createElementNS(NS,'stop'); s2.setAttribute('offset','100%'); s2.setAttribute('stop-color', colorEdge);
  grad.appendChild(s1); grad.appendChild(s2);
  defs.appendChild(grad);
  const c = document.createElementNS(NS,'circle');
  c.setAttribute('r', r);
  c.setAttribute('fill', 'url(#'+id+')');
  c.setAttribute('stroke', colorEdge);
  c.setAttribute('stroke-width', (r*0.08).toFixed(2));
  return c;
}
function makeBloom(svgRoot, opts){
  const petalFill = opts.petalTip ? addPetalGradient(svgRoot, opts.petalBase, opts.petalTip) : opts.petalBase;
  const g = document.createElementNS(NS,'g');
  g.style.filter = 'drop-shadow(0 2px 3px rgba(92,42,61,0.16))';
  const jitter = 1;
  for(let i=0;i<opts.petalCount;i++){
    const ang = (360/opts.petalCount)*i + (Math.random()*jitter*2-jitter);
    const outer = document.createElementNS(NS,'g');
    outer.setAttribute('transform', `rotate(${ang.toFixed(1)})`);
    const inner = document.createElementNS(NS,'g');
    inner.setAttribute('class','petal-unfurl');
    inner.style.transformOrigin = '0px 0px';
    inner.style.animationDelay = (i*0.04).toFixed(2)+'s';
    const p = document.createElementNS(NS,'path');
    p.setAttribute('d', (opts.petalPathFn || petalPath)(opts.len, opts.wid));
    p.setAttribute('fill', petalFill);
    p.setAttribute('stroke', opts.petalStroke || 'rgba(92,42,61,0.10)');
    p.setAttribute('stroke-width','0.5');
    p.setAttribute('stroke-linejoin','round');
    inner.appendChild(p);
    outer.appendChild(inner);
    g.appendChild(outer);
  }
  const cr = opts.wid*0.95;
  g.appendChild(radialCenter(svgRoot, cr, opts.centerBase, opts.centerEdge));
  if(opts.fringe){
    const fCount = 16;
    for(let i=0;i<fCount;i++){
      const a = (360/fCount)*i * Math.PI/180;
      const x1 = Math.cos(a)*cr, y1 = Math.sin(a)*cr;
      const x2 = Math.cos(a)*(cr+cr*0.35), y2 = Math.sin(a)*(cr+cr*0.35);
      const line = document.createElementNS(NS,'line');
      line.setAttribute('x1',x1.toFixed(2)); line.setAttribute('y1',y1.toFixed(2));
      line.setAttribute('x2',x2.toFixed(2)); line.setAttribute('y2',y2.toFixed(2));
      line.setAttribute('stroke', opts.centerEdge); line.setAttribute('stroke-width','0.7');
      line.setAttribute('stroke-linecap','round');
      g.appendChild(line);
    }
  }
  return g;
}
function daisyBloom(svgRoot){
  return makeBloom(svgRoot,{
    petalBase:'#ffffff', petalTip:'#fdf6e8', petalStroke:'rgba(92,42,61,0.10)',
    petalCount:12, len:22, wid:8,
    centerBase:'#ffdd7a', centerEdge:'#e8961f'
  });
}
function roseBloom(svgRoot){
  return makeBloom(svgRoot,{
    petalBase:'#e0447c', petalTip:'#ffc2d6',
    petalCount:9, len:17, wid:8.5,
    centerBase:'#ffe6b3', centerEdge:'#f0b26b'
  });
}
function sunflowerBloom(svgRoot){
  return makeBloom(svgRoot,{
    petalBase:'#ffc94d', petalTip:'#fff0b8',
    petalCount:13, len:20, wid:5.5,
    centerBase:'#a3652f', centerEdge:'#5c3a1e'
  });
}
function lavenderBloom(svgRoot){
  return makeBloom(svgRoot,{
    petalBase:'#c9a6e0', petalTip:'#f2e6ff',
    petalCount:8, len:15, wid:7.5,
    centerBase:'#fff3c4', centerEdge:'#e8d38a'
  });
}
function poppyBloom(svgRoot){
  return makeBloom(svgRoot,{
    petalBase:'#e8412f', petalTip:'#ff8a68', petalStroke:'rgba(60,10,5,0.18)',
    petalCount:5, len:19, wid:11.5,
    petalPathFn: poppyPetalPath,
    centerBase:'#3a2a1a', centerEdge:'#150e08',
    fringe:true
  });
}
const flowerKinds = [daisyBloom, daisyBloom, daisyBloom, poppyBloom, poppyBloom, poppyBloom, roseBloom, sunflowerBloom, lavenderBloom];

function swayWrap(bloomEl, duration, delay){
  const sway = document.createElementNS(NS,'g');
  sway.style.animation = `gentleSway ${duration}s ease-in-out infinite`;
  sway.style.animationDelay = delay+'s';
  sway.style.transformOrigin = '0px 0px';
  sway.appendChild(bloomEl);
  return sway;
}

const gardenSvg = document.getElementById('gardenSvg');
let gardenCount = 0;
const gardenSlots = [40,105,170,235,300,362];
function bloomInGardenSafe(){
  if(gardenCount >= gardenSlots.length) return;
  const x = gardenSlots[gardenCount];
  const y = 48+Math.random()*8;
  const stem = document.createElementNS(NS,'path');
  const wobble = (Math.random()*6-3);
  stem.setAttribute('d', `M${x},100 C${x+wobble},${(100+y)/2+6} ${x-wobble/2},${(100+y)/2-4} ${x},${y}`);
  stem.setAttribute('stroke','#5f9468'); stem.setAttribute('stroke-width','2.4'); stem.setAttribute('fill','none');
  gardenSvg.appendChild(stem);
  const leaf = document.createElementNS(NS,'ellipse');
  leaf.setAttribute('cx', x + (Math.random()>0.5?7:-7));
  leaf.setAttribute('cy', (100+y)/2);
  leaf.setAttribute('rx',6); leaf.setAttribute('ry',2.8);
  leaf.setAttribute('fill','#8fb996');
  leaf.setAttribute('transform', `rotate(${Math.random()>0.5?30:-30} ${x} ${(100+y)/2})`);
  gardenSvg.appendChild(leaf);

  const bloom = flowerKinds[Math.floor(Math.random()*flowerKinds.length)](gardenSvg);
  const swayed = swayWrap(bloom, 3.4+Math.random()*1.6, -(Math.random()*3));
  const outer = document.createElementNS(NS,'g');
  const targetScale = 0.9 + Math.random()*0.3;
  outer.setAttribute('transform', `translate(${x},${y}) scale(0.01)`);
  outer.appendChild(swayed);
  gardenSvg.appendChild(outer);
  let s = 0.01;
  const grow = setInterval(()=>{
    s += targetScale/10;
    if(s >= targetScale){ s = targetScale; clearInterval(grow); }
    outer.setAttribute('transform', `translate(${x},${y}) scale(${s})`);
  }, 18);
  gardenCount++;
}

setTimeout(()=>{
  const autoBloom = setInterval(()=>{
    if(gardenCount >= gardenSlots.length){ clearInterval(autoBloom); return; }
    bloomInGardenSafe();
  }, 900);
}, 500);

let currentStep = 0;
function goTo(step){
  document.querySelectorAll('.step').forEach(s=>s.classList.remove('active'));
  const target = document.querySelector('.step[data-step="'+step+'"]');
  target.classList.add('active');
  currentStep = step;
  if(step === 1){
    buildHeroRose();
  }
  window.scrollTo({top:0, behavior:'smooth'});
}

const petalColors = ['#ff8fab','#ffb3c6','#f4a5b8','#e8a34c','#d63566','#d99bd9','#ffc145'];
function petal(){
  const p = document.createElement('div');
  p.className = 'petal-fall';
  p.style.left = Math.random()*100 + 'vw';
  const size = 9+Math.random()*10;
  p.style.width = size+'px'; p.style.height = (size*0.72)+'px';
  p.style.borderRadius = '50% 0 50% 0';
  p.style.background = petalColors[Math.floor(Math.random()*petalColors.length)];
  p.style.animationDuration = (4+Math.random()*3)+'s';
  document.body.appendChild(p);
  setTimeout(()=>p.remove(), 8000);
}
function smallConfetti(n){ for(let i=0;i<n;i++) setTimeout(petal, i*40); }
let ambientPetals = setInterval(petal, 900);

const balloonColors = ['#ff8fab','#ffc145','#a7d1ff','#d99bd9','#f4a5b8'];
function balloon(){
  const b = document.createElement('div');
  b.className = 'balloon';
  const left = Math.random()*90;
  b.style.left = left+'vw';
  b.style.setProperty('--drift', (Math.random()*60-30)+'px');
  const w = 34+Math.random()*14;
  b.style.width = w+'px'; b.style.height = (w*1.25)+'px';
  b.style.background = `radial-gradient(circle at 35% 30%, #fff8, ${balloonColors[Math.floor(Math.random()*balloonColors.length)]})`;
  b.style.borderRadius = '50% 50% 50% 50% / 60% 60% 40% 40%';
  b.style.animationDuration = (7+Math.random()*4)+'s';
  document.body.appendChild(b);
  setTimeout(()=>b.remove(), 12000);
}

function poof(x,y){
  for(let i=0;i<14;i++){
    const el = document.createElement('div');
    el.style.position='fixed';
    el.style.left=x+'px'; el.style.top=y+'px';
    el.style.width='9px'; el.style.height='7px';
    el.style.background = petalColors[Math.floor(Math.random()*petalColors.length)];
    el.style.borderRadius='50% 0 50% 0';
    el.style.zIndex='9999';
    el.style.pointerEvents='none';
    el.style.transition='transform 0.75s cubic-bezier(.2,.8,.2,1), opacity 0.75s ease';
    document.body.appendChild(el);
    const ang = Math.random()*Math.PI*2;
    const dist = 36+Math.random()*70;
    const dx = Math.cos(ang)*dist, dy = Math.sin(ang)*dist - 20;
    requestAnimationFrame(()=>{
      el.style.transform = `translate(${dx}px, ${dy}px) rotate(${Math.random()*360}deg) scale(0.3)`;
      el.style.opacity = '0';
    });
    setTimeout(()=>el.remove(), 800);
  }
}
const noMessages = ["hayır","emin misin?","bi düşün istersen","son şansın 👀"];
let noClicks = 0;
function noClick(){
  const btn = document.getElementById('no');
  const row = document.getElementById('finalButtons');
  noClicks++;
  if(noClicks < noMessages.length){
    btn.textContent = noMessages[noClicks];
    const scale = (1 - noClicks*0.07).toFixed(2);
    const maxX = Math.max(row.offsetWidth - btn.offsetWidth - 16, 50);
    const rx = (Math.random()*2-1) * (maxX/1.7);
    const ry = (Math.random()*2-1) * 40;
    btn.style.position = 'relative';
    btn.style.left = rx+'px'; btn.style.top = ry+'px';
    btn.style.transform = `scale(${scale})`;
    btn.style.opacity = (1 - noClicks*0.12).toFixed(2);
  } else {
    const rect = btn.getBoundingClientRect();
    poof(rect.left+rect.width/2, rect.top+rect.height/2);
    btn.style.transform = 'scale(0)';
    btn.style.opacity = '0';
    setTimeout(()=>{ btn.style.display='none'; }, 260);
  }
}

function buildHeroRose(){
  const svg = document.getElementById('bouquetHero');
  if(svg.dataset.built) return;
  svg.dataset.built = '1';

  const cx = 100, cy = 96;

  const defs = document.createElementNS(NS,'defs');
  const glow = document.createElementNS(NS,'radialGradient');
  glow.setAttribute('id','heroGlow');
  const gs1 = document.createElementNS(NS,'stop'); gs1.setAttribute('offset','0%'); gs1.setAttribute('stop-color','#fff0d9'); gs1.setAttribute('stop-opacity','0.95');

  svg.appendChild(defs);

  glowCircle.setAttribute('fill','url(#heroGlow)');
  glowCircle.style.animation = 'pulse 5s ease-in-out infinite';
  svg.appendChild(glowCircle);

  const stem = document.createElementNS(NS,'path');
  stem.setAttribute('d', `M${cx},${cy+96} C${cx-7},${cy+62} ${cx+8},${cy+40} ${cx-2},${cy+8}`);
  stem.setAttribute('stroke','#5f9468'); stem.setAttribute('stroke-width','3.4'); stem.setAttribute('fill','none');
  svg.appendChild(stem);
  [[cx-16,cy+56,-40],[cx+15,cy+70,38]].forEach(([x,y,r])=>{
    const leaf = document.createElementNS(NS,'ellipse');
    leaf.setAttribute('cx',x); leaf.setAttribute('cy',y);
    leaf.setAttribute('rx',13); leaf.setAttribute('ry',5.5);
    leaf.setAttribute('fill','#8fb996');
    leaf.setAttribute('transform', `rotate(${r} ${x} ${y})`);
    svg.appendChild(leaf);
  });
  [[cx-32,cy+72,0.5],[cx+34,cy+66,0.46]].forEach(([x,y,sc],i)=>{
    const d = daisyBloom(svg);
    const sw = swayWrap(d, 3.6+i*0.4, -(i*0.5));
    const pw = document.createElementNS(NS,'g');
    pw.setAttribute('transform', `translate(${x},${y}) scale(${sc})`);
    pw.style.opacity='0'; pw.style.animation='riseIn 0.6s ease forwards'; pw.style.animationDelay='0.9s';
    pw.appendChild(sw);
    svg.appendChild(pw);
  });

  const bloomWrap = document.createElementNS(NS,'g');
  bloomWrap.setAttribute('transform', `translate(0,-2)`);
  bloomWrap.style.filter = 'drop-shadow(0 6px 12px rgba(80,20,10,0.3))';

  const petalGradId = 'poppyGrad';
  const pg = document.createElementNS(NS,'linearGradient');
  pg.setAttribute('id', petalGradId);
  pg.setAttribute('x1','0'); pg.setAttribute('y1','1'); pg.setAttribute('x2','0'); pg.setAttribute('y2','0');
  const pg1=document.createElementNS(NS,'stop'); pg1.setAttribute('offset','0%'); pg1.setAttribute('stop-color','#e8351f');
  const pg2=document.createElementNS(NS,'stop'); pg2.setAttribute('offset','100%'); pg2.setAttribute('stop-color','#ff7a52');
  pg.appendChild(pg1); pg.appendChild(pg2);
  defs.appendChild(pg);

  const petalLayers = [
    {count:4, radius:5,  rx:15, ry:26, rot:22, delay:0.15},
    {count:5, radius:9,  rx:20, ry:34, rot:0,  delay:0.55}
  ];
  petalLayers.forEach((layer,li)=>{
    const stepAng = 360/layer.count;
    for(let i=0;i<layer.count;i++){
      const ang = stepAng*i + layer.rot;
      const outer = document.createElementNS(NS,'g');
      outer.setAttribute('transform', `rotate(${ang.toFixed(1)})`);
      const inner = document.createElementNS(NS,'g');
      inner.setAttribute('class','petal-unfurl');
      inner.style.transformOrigin = '0px 0px';
      inner.style.animationDuration = '0.85s';
      inner.style.animationDelay = (layer.delay + i*0.06).toFixed(2)+'s';

      const petal = document.createElementNS(NS,'path');
      petal.setAttribute('d', poppyPetalPath(layer.ry, layer.rx));
      petal.setAttribute('fill', li===0 ? '#c8281c' : `url(#${petalGradId})`);
      petal.setAttribute('stroke','rgba(70,10,5,0.25)'); petal.setAttribute('stroke-width','0.6');
      petal.setAttribute('stroke-linejoin','round');
      inner.appendChild(petal);

      const blotch = document.createElementNS(NS,'ellipse');
      blotch.setAttribute('cx','0'); blotch.setAttribute('cy', -layer.ry*0.32);
      blotch.setAttribute('rx', layer.rx*0.4); blotch.setAttribute('ry', layer.ry*0.22);
      blotch.setAttribute('fill','#2a0f08'); blotch.setAttribute('opacity','0.75');
      inner.appendChild(blotch);

      outer.appendChild(inner);
      bloomWrap.appendChild(outer);
    }
  });
  
  const podR = 9;
  const pod = document.createElementNS(NS,'ellipse');
  pod.setAttribute('rx', podR); pod.setAttribute('ry', podR*0.8);
  pod.setAttribute('fill', '#2a1f10');
  bloomWrap.appendChild(pod);
  const podTop = document.createElementNS(NS,'g');
  for(let i=0;i<10;i++){
    const a = (360/10)*i;
    const line = document.createElementNS(NS,'line');
    line.setAttribute('x1','0'); line.setAttribute('y1','0');
    line.setAttribute('x2','0'); line.setAttribute('y2', -podR*0.9);
    line.setAttribute('stroke','#5a3a1a'); line.setAttribute('stroke-width','0.9');
    line.setAttribute('transform', `rotate(${a})`);
    podTop.appendChild(line);
  }
  bloomWrap.appendChild(podTop);
  const stamenFringe = 18;
  for(let i=0;i<stamenFringe;i++){
    const a = (360/stamenFringe)*i * Math.PI/180;
    const r1 = podR*1.05, r2 = podR*1.55;
    const line = document.createElementNS(NS,'line');
    line.setAttribute('x1',(Math.cos(a)*r1).toFixed(2)); line.setAttribute('y1',(Math.sin(a)*r1).toFixed(2));
    line.setAttribute('x2',(Math.cos(a)*r2).toFixed(2)); line.setAttribute('y2',(Math.sin(a)*r2).toFixed(2));
    line.setAttribute('stroke','#1c1208'); line.setAttribute('stroke-width','1');
    line.setAttribute('stroke-linecap','round');
    bloomWrap.appendChild(line);
  }

  const swayedPoppy = swayWrap(bloomWrap, 4.8, 0);
  const posWrap = document.createElementNS(NS,'g');
  posWrap.setAttribute('transform', `translate(${cx},${cy})`);
  posWrap.appendChild(swayedPoppy);
  svg.appendChild(posWrap);
}
